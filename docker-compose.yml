# ==============================================================================
# TaskFlow Local Multi-Container Development Orchestration
# ==============================================================================
# NOTE: This compose file is for LOCAL DEVELOPMENT ONLY.
# Production deployment on AWS EC2 (Tasks 25-26) uses a separate production compose
# pointing to MongoDB Atlas and pre-built GHCR images.

version: '3.8'

services:
  # 1. MongoDB Database Container
  mongo:
    image: mongo:7.0
    container_name: taskflow-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - taskflow-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 2. Node.js + Express Backend API Container
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskflow-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=development
      - MONGO_URI=mongodb://mongo:27017/taskflow
      - JWT_SECRET=taskflow_local_dev_secret_key_998877
      - JWT_EXPIRES_IN=7d
      - CORS_ORIGIN=http://localhost:8080
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - taskflow-network

  # 3. Nginx + Built React Frontend Container
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=/api
    container_name: taskflow-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - taskflow-network

networks:
  taskflow-network:
    driver: bridge

volumes:
  mongo-data:
    driver: local
