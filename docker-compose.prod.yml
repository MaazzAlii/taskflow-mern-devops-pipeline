# ==============================================================================
# TaskFlow Production Multi-Container Orchestration (GCP Compute Engine / AWS EC2)
# ==============================================================================
# Uses pre-built images from GitHub Container Registry (GHCR) and connects to
# external MongoDB Atlas via environment variables in ~/taskflow/.env

version: '3.8'

services:
  backend:
    image: ghcr.io/maazzalii/taskflow-backend:latest
    container_name: taskflow-backend-prod
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - taskflow-prod-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    image: ghcr.io/maazzalii/taskflow-frontend:latest
    container_name: taskflow-frontend-prod
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - taskflow-prod-network

networks:
  taskflow-prod-network:
    driver: bridge
