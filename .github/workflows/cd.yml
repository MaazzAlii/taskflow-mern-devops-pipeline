name: CD Pipeline (Deploy to GCP / AWS Cloud VM)

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Images to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Owner
        id: repo-owner
        run: |
          echo "owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ steps.repo-owner.outputs.owner }}/taskflow-backend:latest
            ghcr.io/${{ steps.repo-owner.outputs.owner }}/taskflow-backend:${{ github.sha }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          build-args: |
            VITE_API_BASE_URL=/api
          push: true
          tags: |
            ghcr.io/${{ steps.repo-owner.outputs.owner }}/taskflow-frontend:latest
            ghcr.io/${{ steps.repo-owner.outputs.owner }}/taskflow-frontend:${{ github.sha }}

  deploy:
    name: Deploy to Cloud VM (GCP / AWS)
    needs: [build-and-push]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Copy Production Compose File to Cloud VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GCP_HOST || secrets.EC2_HOST }}
          username: ${{ secrets.GCP_USER || secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.GCP_SSH_KEY || secrets.EC2_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "~/taskflow/"

      - name: Execute Remote Redeploy on Cloud VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_HOST || secrets.EC2_HOST }}
          username: ${{ secrets.GCP_USER || secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.GCP_SSH_KEY || secrets.EC2_SSH_KEY }}
          script: |
            cd ~/taskflow
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker system prune -f
