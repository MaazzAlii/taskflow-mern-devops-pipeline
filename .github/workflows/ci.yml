name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-ci:
    name: Backend CI (Lint & Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: npm ci
        working-directory: ./backend

      - name: Run Backend Linter
        run: npm run lint
        working-directory: ./backend

      - name: Run Backend Test Suite
        run: npm test
        working-directory: ./backend

  frontend-ci:
    name: Frontend CI (Lint, Test & Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Run Frontend Linter
        run: npm run lint
        working-directory: ./frontend

      - name: Run Frontend Test Suite
        run: npm test
        working-directory: ./frontend

      - name: Build Production SPA Bundle
        run: npm run build
        working-directory: ./frontend

  docker-build:
    name: Docker Image Build Smoke Test
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        run: docker build -t taskflow-backend ./backend

      - name: Build Frontend Docker Image
        run: docker build -t taskflow-frontend ./frontend
